# Provenance for every field in projects.yml that was derived from GitHub rather than typed by hand.
# confidence: HIGH = directly supported by code/config · MEDIUM = explicitly documented in README/docs ·
#             STATED = stated by the owner (project brief) · LOW = inferred (NEVER published).
# Paths are relative to the repo's default branch (main). Audit date 2026-10-01, public-web access only.
audit:
  date: "2026-10-01"
  method: "No API token available: github.com pages, full git history (clone), repository archives, README/config/source inspection."
  limitations:
    - "Private repositories and private activity are invisible to this audit."
    - "Live URLs could not be probed from the audit environment (egress allow-list); demo URLs are documented, not confirmed live."
    - "CI run logs need authentication; only the latest-run badge status was readable."

