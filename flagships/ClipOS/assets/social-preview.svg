<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d"><title id="t">ClipOS</title><desc id="d">Turns long videos into short vertical clips with generated captions. Built with FastAPI, faster-whisper, OpenCV, Redis RQ.</desc><rect width="1280" height="640" fill="#0A0A0A"/><rect x="0" y="0" width="12" height="640" fill="#3B82F6"/><text x="80" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="700" fill="#FAFAFA">ClipOS</text><rect x="80" y="178" width="96" height="6" fill="#3B82F6"/><text x="80" y="250" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#A3A3A3"><tspan x="80" dy="0">Turns long videos into short</tspan><tspan x="80" dy="44">vertical clips with generated</tspan><tspan x="80" dy="44">captions.</tspan></text><rect x="770" y="230" width="420" height="236" rx="8" fill="none" stroke="#A3A3A3" stroke-width="3"/><rect x="920" y="196" width="133" height="304" rx="8" fill="none" stroke="#3B82F6" stroke-width="6"/><line x1="770" y1="348" x2="920" y2="348" stroke="#2A2A2A" stroke-width="3" stroke-dasharray="8 8"/><line x1="1053" y1="348" x2="1190" y2="348" stroke="#2A2A2A" stroke-width="3" stroke-dasharray="8 8"/><rect x="80" y="520" width="125" height="44" rx="22" fill="none" stroke="#A3A3A3" stroke-width="2"/><text x="142.5" y="549" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#FAFAFA">FastAPI</text><rect x="219" y="520" width="227" height="44" rx="22" fill="none" stroke="#A3A3A3" stroke-width="2"/><text x="332.5" y="549" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#FAFAFA">faster-whisper</text><rect x="460" y="520" width="111" height="44" rx="22" fill="none" stroke="#A3A3A3" stroke-width="2"/><text x="515.5" y="549" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#FAFAF