name: update-profile

on:
  schedule:
    - cron: "17 */6 * * *"        # every 6 h, off-peak minute (GitHub may delay scheduled runs)
  workflow_dispatch: {}
  repository_dispatch:                # optional: sent by templates/notify-profile.yml (docs/EVENT_DISPATCH.md)
    types: [profileos-refresh]        # bursts are serialised by the concurrency group below
  push:
    branches: [main]
    paths: ["data/**", "templates/**", "src/**"]

permissions:
  contents: write                  # commit generated files only

concurrency:
  group: profileos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip runs triggered by our own commits (avoids push -> build -> push loops).
    if: github.actor != 'profileos[bot]'
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Validate data
        run: python -m profileos validate
      - name: Fetch, analyse, generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OPTIONAL, read-only fine-grained PAT (Actions: read, Metadata: read) so CI status can be read with more
          # headroom than public access. Absent/empty is fine: ProfileOS falls back to GITHUB_TOKEN, then public data.
          PROFILEOS_STATUS_TOKEN: ${{ secrets.PROFILEOS_STATUS_TOKEN }}
        run: python -m profileos build
      - name: Commit if changed
        run: |
          git config user.name  "profileos[bot]"
          git config user.email "profileos[bot]@users.noreply.github.com"
          git add -A README.md assets data/cache snapshots docs
          if git diff --cached --quiet; then echo "No material change"; exit 0; fi
          git commit -m "chore(profile): refresh generated sections"
          git push
