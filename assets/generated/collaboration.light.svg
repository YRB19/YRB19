<svg xmlns="http://www.w3.org/2000/svg" width="432" height="168" viewBox="0 0 432 168" role="img" aria-labelledby="po-collaboration-t po-collaboration-d"><title id="po-collaboration-t">Let&#x27;s build something</title><desc id="po-collaboration-d">Have an interesting problem or idea? Let&#x27;s build something useful. I&#x27;m interested in AI systems, developer tools, automation and thoughtful software engineering.</desc><rect x=".5" y=".5" width="431" height="167" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="20" y="24" width="4" height="120" rx="2" fill="#3B82F6"/><text x="36" y="52" font-size="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1F2328" font-weight="600">Have an interesting problem or idea?</text><text x="36" y="80" font-size="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1F2328" font-weight="600">Let&#x27;s build something useful.</text><text x="36" y="110" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#656D76">I&#x27;m interested in AI systems, developer tools,</text><text x="36" y="134" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#656D76">automation and thoughtful software engineering.</text></svg>
