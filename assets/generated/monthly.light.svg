<svg xmlns="http://www.w3.org/2000/svg" width="432" height="206" viewBox="0 0 432 206" role="img" aria-labelledby="po-monthly-t po-monthly-d"><title id="po-monthly-t">Commits by month</title><desc id="po-monthly-d">Commits by month, last 2 months: Oct 26* 39, Nov 26* 87. Commits per month, summed from daily snapshots of the public repositories shown here. * = partial month: only recorded days are counted. An activity signal, not a quality measure.</desc><rect x=".5" y=".5" width="431" height="205" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/><text x="20" y="34" font-size="18" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1F2328" font-weight="600">Commits by month</text><text x="412" y="34" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#656D76" text-anchor="end">Last 2 months</text><line x1="20" y1="48" x2="412" y2="48" stroke="#D0D7DE" stroke-width="1"/><text x="20" y="77.5" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1F2328">Oct 26*</text><rect x="94.64" y="67" width="287.5" height="10" rx="5" fill="#DBE1E6"/><rect x="94.64" y="67" width="128.88" height="10" rx="5" fill="#3B82F6"/><text x="412" y="77.5" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1F2328" font-weight="600" text-anchor="end">39</text><text x="20" y="111.5" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1F2328">Nov 26*</text><rect x="94.64" y="101" width="287.5" height="10" rx="5" fill="#DBE1E6"/><rect x="94.64" y="101" width="287.5" height="10" rx="5" fill="#3B82F6"/><text x="412" y="111.5" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1F2328" font-weight="600" text-anchor="end">87</text><text x="20" y="140" font-size="16" font-family="-apple-system,BlinkMac